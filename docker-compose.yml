name: egpt
services:
    backend:
        build: backend
        container_name: backend
        # env_file:
        #     - backend/.env
        environment:
            - PG_VECTOR_DB=postgresql://postgres:password@database:5432/enterprise_gpt
            - OPENAI_API_KEY=sk-1234
            - OPENAI_API_BASE=http://litellm:4000/
        ports:
            - "8000:8000"
        expose:
            - 8000
        volumes:
            - ./backend:/app
        restart: unless-stopped
        depends_on:
            database:
                condition: service_healthy
        networks:
            - gpt-bridge
        extra_hosts:
            - "host.docker.internal:host-gateway"

    litellm:
        image: ghcr.io/berriai/litellm:main-latest
        container_name: litellm
        env_file:
          - .env
        expose:
            - 4000
        ports:
            - "4000:4000"
        volumes:
          - ./litellm_config.yaml:/app/config.yaml
        command: --config /app/config.yaml --port 4000
        restart: unless-stopped
        depends_on:
            database:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost/health"]
            interval: 30s
            timeout: 10s
            retries: 5
        networks:
            - gpt-bridge

    database:
        image: pgvector/pgvector:pg17
        container_name: gpt_db
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
            POSTGRES_DB: enterprise_gpt
        ports:
            - "5432:5432"
        expose:
            - 5432
        volumes:
            - vector_db_data:/var/lib/postgresql/data
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 30s
            timeout: 10s
            retries: 5
        networks:
            - gpt-bridge

    nginx:
        image: nginx:latest
        container_name: nginx
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf
            - ./frontend/dist:/usr/share/nginx/html
        depends_on:
            - backend
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "nginx", "-t"]
            interval: 30s
            timeout: 10s
            retries: 3
        networks:
            - gpt-bridge

volumes:
    vector_db_data:
        driver: local

networks:
    gpt-bridge:
        driver: bridge
